name: Compilar e testar

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build e testes (Windows)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga

      - name: Compilar (avisos viram erro)
        run: dotnet build LinkFlow.slnx --configuration Release -warnaserror

      - name: Executar testes
        run: dotnet test tests/LinkFlow.Tests --configuration Release --no-build --logger "trx;LogFileName=testes.trx"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: resultados-dos-testes
          path: tests/LinkFlow.Tests/TestResults/*.trx
          if-no-files-found: ignore
