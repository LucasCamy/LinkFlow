name: Preparar release do Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  package:
    name: Testar e empacotar
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga

      - name: Conferir a versão da tag
        shell: pwsh
        run: |
          $app = [xml](Get-Content -LiteralPath src/LinkFlow.App/LinkFlow.App.csproj -Raw)
          $version = $app.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "A tag $env:GITHUB_REF_NAME deve ser v$version."
          }

      - name: Executar testes
        run: dotnet test tests/LinkFlow.Tests --configuration Release

      - name: Gerar instalador, ZIP e hashes
        shell: pwsh
        run: ./scripts/release.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LinkFlow-${{ github.ref_name }}
          path: |
            artifacts/release/LinkFlow-Setup-*.exe
            artifacts/release/LinkFlow-*-portable.zip
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

  draft:
    name: Anexar arquivos ao rascunho
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: LinkFlow-${{ github.ref_name }}
          path: release

      - name: Criar ou completar o rascunho no GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          assets=("LinkFlow-Setup-$version.exe" "LinkFlow-$version-portable.zip" "SHA256SUMS.txt")
          cd release
          sha256sum --check SHA256SUMS.txt
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done

          if is_draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft'); then
            if [[ "$is_draft" != true ]]; then
              echo "O release $GITHUB_REF_NAME já foi publicado."
              exit 0
            fi
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "LinkFlow $version" --generate-notes
          fi
