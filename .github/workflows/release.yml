name: Preparar release do Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag explícita vX.Y.Z'
        required: true
        type: string
      distribution:
        description: 'Official exige certificado; Development é unsigned explícito'
        required: true
        type: choice
        default: Official
        options:
          - Official
          - Development

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Testar e empacotar
    runs-on: windows-2025
    outputs:
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      version: ${{ steps.prepare.outputs.version }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      distribution: ${{ steps.prepare.outputs.distribution }}
      output_dir: ${{ steps.prepare.outputs.output_dir }}
      setup_name: ${{ steps.prepare.outputs.setup_name }}
      zip_name: ${{ steps.prepare.outputs.zip_name }}
      legacy_setup_name: ${{ steps.prepare.outputs.legacy_setup_name }}
      legacy_zip_name: ${{ steps.prepare.outputs.legacy_zip_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga

      - name: Conferir versão, tag e canal explícito
        id: prepare
        shell: pwsh
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
          REQUESTED_DISTRIBUTION: ${{ inputs.distribution }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:REQUESTED_RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          $distribution = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:REQUESTED_DISTRIBUTION } else { 'Official' }
          if ($distribution -cnotin @('Official', 'Development')) { throw 'Canal inválido.' }
          $app = [xml](Get-Content -LiteralPath src/LinkFlow.App/LinkFlow.App.csproj -Raw)
          $versionNodes = $app.SelectNodes('/Project/PropertyGroup/Version')
          if ($versionNodes.Count -ne 1) { throw 'Defina uma única versão explícita no projeto da interface.' }
          $version = $versionNodes[0].InnerText.Trim()
          $parsed = $null
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$' -or -not [version]::TryParse($version, [ref]$parsed) -or $parsed.ToString(3) -cne $version) {
            throw 'A versão deve ser um triplo canônico X.Y.Z.'
          }
          if ($tag -cne "v$version") { throw "A tag deve ser exatamente v$version." }
          $sourceSha = (& git rev-parse --verify HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $sourceSha -notmatch '^[0-9a-f]{40}$') { throw 'Não foi possível identificar o commit compilado.' }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $sourceSha -cne $env:GITHUB_SHA.ToLowerInvariant()) { throw 'Checkout e SHA do dispatch divergem.' }
          $setup = if ($distribution -eq 'Official') { "LinkFlow-Setup-$version.exe" } else { "LinkFlow-Dev-Setup-$version.exe" }
          $zip = if ($distribution -eq 'Official') { "LinkFlow-$version-portable.zip" } else { "LinkFlow-$version-dev-portable.zip" }
          $directory = if ($distribution -eq 'Official') { 'artifacts/release' } else { 'artifacts/development' }
          @("release_tag=$tag", "version=$version", "distribution=$distribution", "output_dir=$directory", "setup_name=$setup", "zip_name=$zip", "legacy_setup_name=LinkFlow-Setup-$version.exe", "legacy_zip_name=LinkFlow-$version-portable.zip") | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "source_sha=$sourceSha" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Executar testes
        run: dotnet test tests/LinkFlow.Tests --configuration Release

      - name: Preparar assinatura oficial
        if: steps.prepare.outputs.distribution == 'Official'
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.LINKFLOW_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.LINKFLOW_SIGNING_PFX_PASSWORD }}
          LINKFLOW_SIGNING_PUBLISHER: ${{ vars.LINKFLOW_SIGNING_PUBLISHER }}
          LINKFLOW_SIGNING_CERT_SHA256: ${{ vars.LINKFLOW_SIGNING_CERT_SHA256 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:LINKFLOW_SIGNING_PUBLISHER) -or
              [string]::IsNullOrWhiteSpace($env:LINKFLOW_SIGNING_CERT_SHA256)) {
            throw 'Release oficial bloqueado: configure o certificado e a identidade esperada. Development exige seleção explícita no workflow_dispatch.'
          }
          $signingPfx = Join-Path $env:RUNNER_TEMP ('LinkFlow-signing-' + [Guid]::NewGuid().ToString('N') + '.pfx')
          try {
            [IO.File]::WriteAllBytes($signingPfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $signingPassword = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $importedCertificates = Import-PfxCertificate -FilePath $signingPfx -CertStoreLocation Cert:\CurrentUser\My -Password $signingPassword
            $signingCertificate = @($importedCertificates | Where-Object HasPrivateKey)
            if ($signingCertificate.Count -ne 1) { throw 'O pacote deve conter uma única identidade de assinatura com chave privada.' }
            "LINKFLOW_SIGNING_THUMBPRINT=$($signingCertificate[0].Thumbprint)" | Add-Content -LiteralPath $env:GITHUB_ENV
          }
          finally {
            if (Test-Path -LiteralPath $signingPfx) { Remove-Item -LiteralPath $signingPfx -Force }
          }

      - name: Gerar instalador, ZIP e hashes do canal
        shell: pwsh
        env:
          RELEASE_DISTRIBUTION: ${{ steps.prepare.outputs.distribution }}
          RELEASE_SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
          LINKFLOW_SIGNING_PUBLISHER: ${{ vars.LINKFLOW_SIGNING_PUBLISHER }}
          LINKFLOW_SIGNING_CERT_SHA256: ${{ vars.LINKFLOW_SIGNING_CERT_SHA256 }}
        run: ./scripts/release.ps1 -Distribution $env:RELEASE_DISTRIBUTION -SourceCommit $env:RELEASE_SOURCE_SHA

      - name: Remover identidade de assinatura do runner
        if: always() && steps.prepare.outputs.distribution == 'Official'
        shell: pwsh
        run: |
          if ($env:LINKFLOW_SIGNING_THUMBPRINT -match '^[0-9A-Fa-f]{40}$') {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:LINKFLOW_SIGNING_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LinkFlow-${{ steps.prepare.outputs.release_tag }}-${{ steps.prepare.outputs.distribution }}
          path: |
            ${{ steps.prepare.outputs.output_dir }}/${{ steps.prepare.outputs.setup_name }}
            ${{ steps.prepare.outputs.output_dir }}/${{ steps.prepare.outputs.zip_name }}
            ${{ steps.prepare.outputs.output_dir }}/${{ steps.prepare.outputs.legacy_setup_name }}
            ${{ steps.prepare.outputs.output_dir }}/${{ steps.prepare.outputs.legacy_zip_name }}
            ${{ steps.prepare.outputs.output_dir }}/SHA256SUMS.txt
            ${{ steps.prepare.outputs.output_dir }}/release-manifest.json
          if-no-files-found: error
          compression-level: 0

  draft:
    name: Conferir e anexar arquivos ao rascunho
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: LinkFlow-${{ needs.package.outputs.release_tag }}-${{ needs.package.outputs.distribution }}
          path: release

      - name: Validar canal e criar ou completar o rascunho
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_DISTRIBUTION: ${{ needs.package.outputs.distribution }}
          SOURCE_SHA: ${{ needs.package.outputs.source_sha }}
          SETUP_NAME: ${{ needs.package.outputs.setup_name }}
          ZIP_NAME: ${{ needs.package.outputs.zip_name }}
          LEGACY_SETUP_NAME: ${{ needs.package.outputs.legacy_setup_name }}
          LEGACY_ZIP_NAME: ${{ needs.package.outputs.legacy_zip_name }}
        run: |
          set -euo pipefail
          cd release
          assets=("$SETUP_NAME" "$ZIP_NAME" "SHA256SUMS.txt" "release-manifest.json")
          sha256sum --check SHA256SUMS.txt
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          jq -e --arg source "$SOURCE_SHA" '.sourceCommit == $source' release-manifest.json > /dev/null
          if [[ "$RELEASE_DISTRIBUTION" == "Official" ]]; then
            jq -e --arg version "$RELEASE_VERSION" '.version == $version and .channel == "Official" and .publisherVerified == true and
              (.publisher | type == "string" and length > 0) and (.certificateSha256 | test("^[0-9A-Fa-f]{64}$"))' release-manifest.json > /dev/null
          elif [[ "$RELEASE_DISTRIBUTION" == "Development" ]]; then
            jq -e --arg version "$RELEASE_VERSION" --arg setup "$SETUP_NAME" --arg zip "$ZIP_NAME" --arg legacySetup "$LEGACY_SETUP_NAME" --arg legacyZip "$LEGACY_ZIP_NAME" '
              .version == $version and .channel == "Development" and .publisherVerified == false and .publisher == null and .certificateSha256 == null and
              (.compatibilityAliases | length == 2) and
              any(.compatibilityAliases[]; .name == $legacySetup and .source == $setup and .contentIdentical == true and (.sha256 | test("^[0-9A-Fa-f]{64}$"))) and
              any(.compatibilityAliases[]; .name == $legacyZip and .source == $zip and .contentIdentical == true and (.sha256 | test("^[0-9A-Fa-f]{64}$")))' release-manifest.json > /dev/null
            cmp --silent "$SETUP_NAME" "$LEGACY_SETUP_NAME"
            cmp --silent "$ZIP_NAME" "$LEGACY_ZIP_NAME"
            for alias in "$LEGACY_SETUP_NAME" "$LEGACY_ZIP_NAME"; do
              expected=$(jq -r --arg alias "$alias" '.compatibilityAliases[] | select(.name == $alias) | .sha256' release-manifest.json)
              actual=$(sha256sum "$alias" | cut -d' ' -f1)
              [[ "${actual^^}" == "${expected^^}" ]]
            done
            assets+=("$LEGACY_SETUP_NAME" "$LEGACY_ZIP_NAME")
          else
            echo "Canal inesperado"; exit 1
          fi
          for asset in "${assets[@]}"; do test -s "$asset"; done
          # A release target hint never replaces verification of an existing
          # lightweight or annotated tag. API failures are not "tag absent".
          resolve_tag() {
            local refs ref kind sha object depth
            refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG") || return 1
            jq -e 'type == "array" and length <= 128' <<< "$refs" > /dev/null || return 1
            ref=$(jq -c --arg ref "refs/tags/$RELEASE_TAG" '[.[] | select(.ref == $ref)] | if length > 1 then error("duplicate ref") else .[0] // null end' <<< "$refs") || return 1
            if [[ "$ref" == null ]]; then return 0; fi
            kind=$(jq -r '.object.type' <<< "$ref")
            sha=$(jq -r '.object.sha' <<< "$ref")
            for ((depth=0; depth<8; depth++)); do
              [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
              if [[ "$kind" == commit ]]; then printf '%s\n' "${sha,,}"; return 0; fi
              [[ "$kind" == tag ]] || return 1
              object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha") || return 1
              kind=$(jq -r '.object.type' <<< "$object")
              sha=$(jq -r '.object.sha' <<< "$object")
            done
            echo 'Tag anotada excede o limite de resolução.' >&2
            return 1
          }
          read_existing_release() {
            local owner repository response id release
            owner="${GITHUB_REPOSITORY%%/*}"
            repository="${GITHUB_REPOSITORY#*/}"
            [[ "$owner" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ && "$repository" =~ ^[A-Za-z0-9_.-]{1,100}$ ]] || {
              echo 'Identidade de repositório inválida.' >&2; return 1;
            }
            # REST /releases/tags only finds published releases. Match drafts
            # exactly through GraphQL, then fetch their REST shape by numeric ID.
            response=$(gh api graphql -f query='query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){databaseId}}}' -f owner="$owner" -f name="$repository" -f tag="$RELEASE_TAG") || return 1
            jq -e '((.errors // []) | length == 0) and (.data.repository | type == "object" and has("release"))' <<< "$response" > /dev/null || {
              echo 'Falha de consulta/autorização ao procurar release.' >&2; return 1;
            }
            if [[ $(jq -r '.data.repository.release == null' <<< "$response") == true ]]; then
              printf 'null\n'; return 0
            fi
            id=$(jq -r '.data.repository.release.databaseId' <<< "$response") || return 1
            [[ "$id" =~ ^[1-9][0-9]{0,19}$ ]] || { echo 'ID de release inválido.' >&2; return 1; }
            release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id") || return 1
            jq -e --argjson id "$id" --arg tag "$RELEASE_TAG" '.id == $id and .tag_name == $tag' <<< "$release" > /dev/null || return 1
            printf '%s\n' "$release"
          }
          expected_names=$(printf '%s\n' "${assets[@]}" | jq -R . | jq -s .)
          existing=$(read_existing_release) || exit 1
          if [[ "$existing" != null ]]; then
            # Reusing an unknown/other-channel draft or leaving stale extra
            # assets is refused before any upload or remote-ref creation.
            jq -e --arg tag "$RELEASE_TAG" --argjson names "$expected_names" '
              .tag_name == $tag and (.draft | type == "boolean") and (.assets | type == "array") and
              (([.assets[].name] - $names) | length == 0) and
              ([.assets[].name] | length == (unique | length)) and
              all(.assets[]; .state == "uploaded" and .size > 0) and
              ([.assets[] | select(.name == "release-manifest.json" and .size <= 1048576)] | length == 1)' <<< "$existing" > /dev/null
            remote_dir=$(mktemp -d "$RUNNER_TEMP/linkflow-release-identity.XXXXXX")
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --dir "$remote_dir"
            jq -e --slurpfile incoming release-manifest.json '
              .version == $incoming[0].version and .channel == $incoming[0].channel and .sourceCommit == $incoming[0].sourceCommit and
              .publisherVerified == $incoming[0].publisherVerified and .publisher == $incoming[0].publisher and
              .certificateSha256 == $incoming[0].certificateSha256' "$remote_dir/release-manifest.json" > /dev/null
            rm -f -- "$remote_dir/release-manifest.json"
            rmdir -- "$remote_dir"
          fi
          resolved=$(resolve_tag) || exit 1
          if [[ -z "$resolved" ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || { echo 'A tag do push não existe.' >&2; exit 1; }
            if [[ "$existing" != null && $(jq -r '.draft' <<< "$existing") != true ]]; then
              echo 'Release publicado com tag ausente não será alterado.' >&2; exit 1
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$SOURCE_SHA" > /dev/null
            resolved=$(resolve_tag) || exit 1
          fi
          [[ "$resolved" == "$SOURCE_SHA" ]] || { echo 'Tag remota não aponta para o commit compilado.' >&2; exit 1; }
          if [[ "$existing" != null && $(jq -r '.draft' <<< "$existing") != true ]]; then
            jq -e --argjson names "$expected_names" '([.assets[].name] | sort) == ($names | sort)' <<< "$existing" > /dev/null
            for asset in "${assets[@]}"; do
              actual=$(sha256sum "$asset" | cut -d' ' -f1)
              remote_digest=$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .digest // empty' <<< "$existing")
              [[ "${remote_digest,,}" == "sha256:${actual,,}" ]] || { echo "Asset publicado diverge ou tem digest desconhecido: $asset" >&2; exit 1; }
            done
            echo "Release $RELEASE_TAG existente conferido; nenhum arquivo foi alterado."
            exit 0
          fi
          # Recheck after readonly release/manifest inspection, immediately
          # before the publication mutation. Never move or force-update a tag.
          resolved=$(resolve_tag) || exit 1
          [[ "$resolved" == "$SOURCE_SHA" ]] || { echo 'Tag mudou antes do upload.' >&2; exit 1; }
          if [[ "$existing" != null ]]; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            create_options=(--draft --verify-tag --title "LinkFlow $RELEASE_VERSION" --generate-notes)
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then create_options+=(--target "$GITHUB_SHA"); fi
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" "${create_options[@]}"
          fi
          resolved=$(resolve_tag) || exit 1
          [[ "$resolved" == "$SOURCE_SHA" ]] || { echo 'Tag mudou durante a preparação do rascunho.' >&2; exit 1; }
